name: KnitChartStudio
options:
  bundleIdPrefix: com.tokyonasu
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.9'
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '2'
targets:
  KnitChartStudio:
    type: application
    platform: iOS
    sources: [KnitChartStudio]
    info:
      path: KnitChartStudio/Info.plist
      properties:
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tokyonasu.KnitChartStudio
        TARGETED_DEVICE_FAMILY: '1,2'
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: 編み図工房
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    scheme:
      testTargets: [KnitChartTests]
  KnitChartTests:
    type: bundle.unit-test
    platform: iOS
    sources: [RenderTests]
    dependencies:
      - target: KnitChartStudio
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.tokyonasu.KnitChartStudio.tests
